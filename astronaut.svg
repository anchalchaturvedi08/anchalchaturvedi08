<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="340" height="340" fill="none" role="img" aria-label="Astronaut floating in space" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="space" cx="42%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#2e2278"/>
      <stop offset="48%" stop-color="#16103f"/>
      <stop offset="100%" stop-color="#06050e"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="42%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#180f3d"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfc4de"/>
    </linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5abc9"/>
      <stop offset="100%" stop-color="#6f7699"/>
    </linearGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <rect width="340" height="340" rx="26" fill="url(#space)"/>

  <!-- distant stars -->
  <g fill="#ffffff">
    <circle cx="28" cy="44" r="1.6" opacity=".85"/>
    <circle cx="62" cy="22" r="1" opacity=".5"/>
    <circle cx="96" cy="58" r="1.3" opacity=".7"/>
    <circle cx="132" cy="28" r="0.9" opacity=".45"/>
    <circle cx="176" cy="46" r="1.5" opacity=".8"/>
    <circle cx="214" cy="20" r="1" opacity=".55"/>
    <circle cx="252" cy="52" r="1.2" opacity=".65"/>
    <circle cx="298" cy="34" r="1.7" opacity=".9"/>
    <circle cx="316" cy="88" r="1" opacity=".5"/>
    <circle cx="22" cy="104" r="1.2" opacity=".6"/>
    <circle cx="54" cy="142" r="0.9" opacity=".45"/>
    <circle cx="20" cy="186" r="1.5" opacity=".75"/>
    <circle cx="44" cy="238" r="1.1" opacity=".55"/>
    <circle cx="26" cy="292" r="1.4" opacity=".7"/>
    <circle cx="74" cy="312" r="1" opacity=".5"/>
    <circle cx="124" cy="296" r="1.3" opacity=".65"/>
    <circle cx="186" cy="316" r="0.9" opacity=".45"/>
    <circle cx="238" cy="298" r="1.5" opacity=".78"/>
    <circle cx="288" cy="312" r="1" opacity=".5"/>
    <circle cx="312" cy="252" r="1.3" opacity=".68"/>
    <circle cx="300" cy="196" r="1" opacity=".5"/>
    <circle cx="318" cy="148" r="1.5" opacity=".72"/>
    <circle cx="256" cy="120" r="0.9" opacity=".4"/>
    <circle cx="84" cy="88" r="0.9" opacity=".4"/>
  </g>

  <!-- four-point sparkles -->
  <g fill="#e9d5ff" opacity=".9">
    <path d="M262 76 l2.6 7 7 2.6 -7 2.6 -2.6 7 -2.6 -7 -7 -2.6 7 -2.6z"/>
    <path d="M48 66 l1.9 5.1 5.1 1.9 -5.1 1.9 -1.9 5.1 -1.9 -5.1 -5.1 -1.9 5.1 -1.9z"/>
    <path d="M296 268 l2.2 5.9 5.9 2.2 -5.9 2.2 -2.2 5.9 -2.2 -5.9 -5.9 -2.2 5.9 -2.2z"/>
  </g>

  <!-- planet -->
  <g transform="translate(70,268)">
    <circle r="30" fill="url(#planet)"/>
    <ellipse rx="46" ry="12" fill="none" stroke="#c4b5fd" stroke-width="3" opacity=".75" transform="rotate(-22)"/>
    <circle cx="-10" cy="-9" r="6" fill="#ffffff" opacity=".13"/>
    <circle cx="9" cy="7" r="9" fill="#000000" opacity=".12"/>
  </g>

  <!-- tether -->
  <path d="M196 214 C 238 232, 268 262, 286 306" stroke="#8b93b8" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>

  <!-- astronaut -->
  <g transform="translate(172,150) rotate(-10)">
    <!-- backpack -->
    <rect x="-27" y="-24" width="54" height="58" rx="15" fill="url(#pack)"/>
    <!-- arms -->
    <rect x="-50" y="-13" width="27" height="16" rx="8" fill="url(#suit)" transform="rotate(-28 -36 -5)"/>
    <rect x="23" y="-15" width="28" height="16" rx="8" fill="url(#suit)" transform="rotate(26 37 -7)"/>
    <!-- legs -->
    <rect x="-22" y="26" width="18" height="34" rx="9" fill="url(#suit)" transform="rotate(-9 -13 43)"/>
    <rect x="5" y="26" width="18" height="34" rx="9" fill="url(#suit)" transform="rotate(11 14 43)"/>
    <!-- boots -->
    <rect x="-25" y="54" width="21" height="12" rx="6" fill="#8b93b8" transform="rotate(-9 -14 60)"/>
    <rect x="5" y="54" width="21" height="12" rx="6" fill="#8b93b8" transform="rotate(11 15 60)"/>
    <!-- torso -->
    <rect x="-25" y="-20" width="50" height="53" rx="17" fill="url(#suit)"/>
    <!-- chest panel -->
    <rect x="-12" y="-4" width="24" height="17" rx="5" fill="#2e1065"/>
    <circle cx="-4.5" cy="4.5" r="2.7" fill="#38bdf8"/>
    <circle cx="4.5" cy="4.5" r="2.7" fill="#f472b6"/>
    <!-- helmet -->
    <circle cx="0" cy="-45" r="32" fill="url(#suit)"/>
    <circle cx="0" cy="-45" r="23.5" fill="url(#visor)"/>
    <ellipse cx="-8" cy="-54" rx="8" ry="5" fill="#ffffff" opacity=".55" transform="rotate(-28 -8 -54)"/>
    <ellipse cx="7" cy="-36" rx="4" ry="2.6" fill="#ffffff" opacity=".28" transform="rotate(-28 7 -36)"/>
  </g>
</svg>
